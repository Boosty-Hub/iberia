name: App de iOS

# Manual a propósito: compilar —y sobre todo subir a App Store Connect— nunca
# puede ser un efecto secundario de hacer push a una rama.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Subir la compilación a App Store Connect"
        type: boolean
        default: false

# El trabajo solo necesita leer el código.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: "45TRWF6998"
      BUNDLE_ID: "com.industriasiberia.canal"
      # Tiene que coincidir letra por letra con el nombre del perfil de
      # aprovisionamiento App Store creado en Apple Developer.
      PROFILE_NAME: "Iberia App Store CI"
      # El perfil está atado al certificado «Apple Distribution» del equipo (el
      # mismo que firma Guds), así que la identidad es "Apple Distribution", NO
      # "iPhone Distribution" como en Boosty Desk, cuyo certificado es otro.
      # Tiene que decir lo mismo que CODE_SIGN_IDENTITY en project.pbxproj.
      SIGN_IDENTITY: "Apple Distribution"

    steps:
      - uses: actions/checkout@v4

      # Falla en segundos y no después de 20 minutos de archivo: Apple rechaza lo
      # compilado con un SDK viejo, y la imagen del runner cambia sin avisar.
      - name: Comprobar que el SDK de iOS es reciente
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK iphoneos: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "El SDK $SDK es muy viejo: Apple rechazaría la subida"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Sin `next build`: la app carga el sitio en línea (`server.url` en
      # capacitor.config.ts) y lo único que copia al binario es `movil/www`,
      # que es estático y está en el repositorio.
      - run: npm ci

      # `cap sync` en el runner genera lo que no está en git (ios/.gitignore):
      # la carpeta web, capacitor.config.json, config.xml y los plugins de
      # Cordova. Y reescribe Package.swift con las rutas de esta máquina.
      - run: npx cap sync ios

      - name: Instalar la firma en un llavero desechable
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for nombre in CERT_P12 CERT_PASSWORD PROFILE; do
            if [ -z "${!nombre}" ]; then echo "::error::Falta el secreto de $nombre."; exit 1; fi
          done

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PW"
          CERT="$RUNNER_TEMP/cert.p12"
          PERFIL="$RUNNER_TEMP/profile.mobileprovision"

          # printf y no echo: echo le agrega un salto de línea al base64.
          printf '%s' "$CERT_P12" | base64 --decode > "$CERT"
          printf '%s' "$PROFILE"  | base64 --decode > "$PERFIL"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # El .p12 es PKCS#12 «legacy» (3DES y SHA-1), hecho para `security`:
          # macOS lo importa tal cual. Uno exportado con el cifrado por defecto de
          # OpenSSL 3 (AES y PBKDF2) falla aquí con «MAC verification failed»,
          # aunque la contraseña esté bien. El formato va explícito para que no lo
          # adivine por la extensión.
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Sin esto, codesign abre un diálogo de permiso del llavero que nadie
          # contesta en un runner sin pantalla, y el trabajo se cuelga hasta el límite.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          # El llavero nuevo va primero, sin sacar los que ya tenía el runner.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"

          # Que la identidad que pide el proyecto esté de verdad en el llavero:
          # si el .p12 es de otro certificado, falla aquí y no a mitad del archivo.
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "\"$SIGN_IDENTITY: .*($TEAM_ID)\""; then
            echo "::error::El .p12 no trae una identidad «$SIGN_IDENTITY» del equipo $TEAM_ID."
            exit 1
          fi

          # Que el perfil sea el que se espera, y con push, antes de instalarlo.
          security cms -D -i "$PERFIL" > "$RUNNER_TEMP/profile.plist"
          PERFIL_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PERFIL_NOMBRE="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PERFIL_APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)"
          PERFIL_VENCE="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          echo "Perfil: '$PERFIL_NOMBRE' ($PERFIL_UUID), aps-environment=$PERFIL_APS, vence $PERFIL_VENCE"
          if [ "$PERFIL_NOMBRE" != "$PROFILE_NAME" ]; then
            echo "::error::El perfil se llama '$PERFIL_NOMBRE' y se esperaba '$PROFILE_NAME'."
            exit 1
          fi
          if [ "$PERFIL_APS" != "production" ]; then
            echo "::error::El perfil no trae aps-environment=production: ¿se creó antes de activar Push en el App ID?"
            exit 1
          fi

          # La carpeta clásica y la que lee Xcode desde la versión 16.
          for carpeta in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                         "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$carpeta"
            cp "$PERFIL" "$carpeta/$PERFIL_UUID.mobileprovision"
          done
          rm -f "$PERFIL" "$RUNNER_TEMP/profile.plist"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "PERFIL_UUID=$PERFIL_UUID" >> "$GITHUB_ENV"

      - name: Archivar
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive

      - name: Exportar el .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # El .ipa se guarda aunque no se suba, para poder revisarlo sin volver a
      # compilar.
      - name: Guardar el .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Iberia-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          # El .ipa es de uso interno: no se queda los 90 días por defecto.
          retention-days: 14

      - name: Subir a App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for nombre in ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!nombre}" ]; then echo "::error::Falta el secreto $nombre."; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/private_keys"
          # altool busca la clave por este nombre exacto: AuthKey_<KEY_ID>.p8.
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"

          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Pase lo que pase: el llavero, el perfil y la clave no se quedan en el runner.
      - name: Limpiar la firma
        if: always()
        run: |
          KEYCHAIN="${KEYCHAIN:-$RUNNER_TEMP/build.keychain-db}"
          security default-keychain -d user -s login.keychain-db || true
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${PERFIL_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PERFIL_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PERFIL_UUID.mobileprovision"
          fi
